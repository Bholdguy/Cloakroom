[package]
name = "cloakroom"
version = "0.1.0"
edition = "2024_07"
description = "Cloakroom — application-layer private payroll/vesting helper for the live STRK20 Privacy Pool."

# Cairo / Foundry pins match packages/privacy at tag PRIVACY-0.14.3-RC.0
# (compatibility matrix "Privacy Pool" row): edition 2024_07, starknet 2.17.0,
# snforge_std 0.59.0. See starkware-libs/starknet-privacy README + that tag's Scarb.toml.

[dependencies]
starknet = "2.17.0"
openzeppelin = "3.0.0"
privacy = { git = "https://github.com/starkware-libs/starknet-privacy.git", tag = "PRIVACY-0.14.3-RC.0" }

[dev-dependencies]
snforge_std = "0.59.0"
assert_macros = "2.17.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
